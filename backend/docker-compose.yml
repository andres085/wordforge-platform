services:
  db:
    image: 'postgres:14'
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: user
      POSTGRES_USER: user
      POSTGRES_DB: wordforge
    container_name: wordforge-db
    volumes:
      - ./postgres:/var/lib/postgresql/data

  test-db:
    image: 'postgres:14'
    container_name: wordforge-db-test
    restart: always
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: wordforge_test
    volumes:
      - ./postgres_test_data:/var/lib/postgresql/data
